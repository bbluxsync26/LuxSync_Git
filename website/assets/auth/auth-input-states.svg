<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" fill="none">
  <title>LuxSync authentication input state reference</title>
  <defs>
    <style>
      .display { font-family: Manrope, Inter, sans-serif; fill: #D0BEB0; }
      .body { font-family: Inter, sans-serif; fill: #D0BEB0; }
      .muted { fill: #9E8B85; }
      .metal { fill: #D6B0A0; }
    </style>
    <filter id="focusGlow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <rect width="1400" height="760" rx="30" fill="#0D1526"/>
  <text class="display" x="72" y="84" font-size="34" font-weight="600">Auth Input States</text>
  <text class="body muted" x="72" y="118" font-size="16">Reference only. Build all fields as semantic HTML/CSS.</text>

  <g transform="translate(72 174)">
    <text class="display" y="0" font-size="15" font-weight="600">DEFAULT</text>
    <text class="body" y="42" font-size="14" font-weight="500">Email Address</text>
    <rect y="58" width="376" height="62" rx="14" fill="#172036" stroke="#D0BEB0" stroke-opacity="0.14"/>
    <text class="body muted" x="20" y="96" font-size="14">you@luxsync.com</text>
  </g>

  <g transform="translate(512 174)">
    <text class="display" y="0" font-size="15" font-weight="600">HOVER</text>
    <text class="body" y="42" font-size="14" font-weight="500">Email Address</text>
    <rect y="58" width="376" height="62" rx="14" fill="#172036" stroke="#7B96B2" stroke-opacity="0.34"/>
    <text class="body muted" x="20" y="96" font-size="14">you@luxsync.com</text>
  </g>

  <g transform="translate(952 174)">
    <text class="display" y="0" font-size="15" font-weight="600">FOCUS</text>
    <text class="body" y="42" font-size="14" font-weight="500">Email Address</text>
    <rect x="-8" y="50" width="392" height="78" rx="20" fill="#7B96B2" fill-opacity="0.12" filter="url(#focusGlow)"/>
    <rect y="58" width="376" height="62" rx="14" fill="#172036" stroke="#7B96B2" stroke-opacity="0.74" stroke-width="2"/>
    <rect x="-4" y="54" width="384" height="70" rx="18" stroke="#7B96B2" stroke-opacity="0.38" stroke-width="3"/>
    <text class="body" x="20" y="96" font-size="14">you@luxsync.com</text>
  </g>

  <g transform="translate(72 418)">
    <text class="display" y="0" font-size="15" font-weight="600">FILLED / VALID</text>
    <text class="body" y="42" font-size="14" font-weight="500">Email Address</text>
    <rect y="58" width="376" height="62" rx="14" fill="#172036" stroke="#D0BEB0" stroke-opacity="0.16"/>
    <text class="body" x="20" y="96" font-size="14">you@luxsync.com</text>
    <path d="M334 89L344 99L362 79" stroke="#D6B0A0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="body muted" y="148" font-size="12">Use icon/text as needed; never color alone.</text>
  </g>

  <g transform="translate(512 418)">
    <text class="display" y="0" font-size="15" font-weight="600">ERROR</text>
    <text class="body" y="42" font-size="14" font-weight="500">Email Address</text>
    <rect y="58" width="376" height="62" rx="14" fill="#172036" stroke="#D6B0A0" stroke-opacity="0.62"/>
    <text class="body" x="20" y="96" font-size="14">you@luxsync.com</text>
    <circle cx="346" cy="89" r="12" stroke="#D6B0A0" stroke-opacity="0.88"/>
    <path d="M346 82V91M346 96V97" stroke="#D6B0A0" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="148" font-family="Inter, sans-serif" fill="#E3BEB5" font-size="12">Enter a valid email address.</text>
  </g>

  <g transform="translate(952 418)" opacity="0.48">
    <text class="display" y="0" font-size="15" font-weight="600">DISABLED</text>
    <text class="body" y="42" font-size="14" font-weight="500">Email Address</text>
    <rect y="58" width="376" height="62" rx="14" fill="#172036" stroke="#D0BEB0" stroke-opacity="0.10"/>
    <text class="body muted" x="20" y="96" font-size="14">you@luxsync.com</text>
  </g>

  <path d="M72 642H1328" stroke="#D0BEB0" stroke-opacity="0.08"/>
  <text class="body muted" x="72" y="688" font-size="14">Focus = visible ring + restrained Dusty Steel underlight. Error = linked message + icon/text. No shake animation or flashing.</text>
</svg>
