<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100" fill="none">
  <title>LuxSync VIP authentication card reference</title>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF2EA"/>
      <stop offset="0.22" stop-color="#EAC8B9"/>
      <stop offset="0.48" stop-color="#D6B0A0"/>
      <stop offset="0.72" stop-color="#9C675C"/>
      <stop offset="0.86" stop-color="#F2D6C8"/>
      <stop offset="1" stop-color="#7D4E49"/>
    </linearGradient>
    <radialGradient id="underlight" cx="0" cy="0" r="1" gradientTransform="translate(450 925) rotate(-90) scale(290 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7B96B2" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#7B96B2" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7B96B2" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="34" stdDeviation="28" flood-color="#070C18" flood-opacity="0.62"/>
    </filter>
    <style>
      .display { font-family: Manrope, Inter, sans-serif; fill: #D0BEB0; }
      .body { font-family: Inter, sans-serif; fill: #D0BEB0; }
      .muted { fill: #9E8B85; }
      .metalText { fill: #D6B0A0; }
    </style>
  </defs>

  <rect width="900" height="1100" fill="#0D1526"/>
  <ellipse cx="450" cy="860" rx="360" ry="290" fill="url(#underlight)"/>

  <g filter="url(#shadow)">
    <rect x="184" y="100" width="532" height="850" rx="30" fill="#172036" stroke="#D0BEB0" stroke-opacity="0.12" stroke-width="2"/>
    <rect x="185" y="101" width="530" height="848" rx="29" stroke="url(#metal)" stroke-opacity="0.12"/>
  </g>

  <image href="../../../brand/assets/logos/png/luxsync-orb.png" x="374" y="145" width="152" height="152" preserveAspectRatio="xMidYMid meet"/>

  <text class="display" x="450" y="340" text-anchor="middle" font-size="34" font-weight="600">Member Login</text>
  <text class="body muted" x="450" y="378" text-anchor="middle" font-size="17">Access your LuxSync account.</text>

  <text class="body" x="244" y="444" font-size="15" font-weight="500">Email Address</text>
  <rect x="238" y="460" width="424" height="64" rx="14" fill="#0D1526" fill-opacity="0.68" stroke="#D0BEB0" stroke-opacity="0.14"/>
  <text class="body muted" x="262" y="500" font-size="15">you@luxsync.com</text>

  <text class="body" x="244" y="568" font-size="15" font-weight="500">Password</text>
  <rect x="238" y="584" width="424" height="64" rx="14" fill="#0D1526" fill-opacity="0.68" stroke="#7B96B2" stroke-opacity="0.30"/>
  <rect x="246" y="592" width="408" height="48" rx="11" stroke="#7B96B2" stroke-opacity="0.08"/>
  <g fill="#D0BEB0" opacity="0.88">
    <circle cx="268" cy="616" r="4"/><circle cx="284" cy="616" r="4"/><circle cx="300" cy="616" r="4"/><circle cx="316" cy="616" r="4"/><circle cx="332" cy="616" r="4"/><circle cx="348" cy="616" r="4"/><circle cx="364" cy="616" r="4"/><circle cx="380" cy="616" r="4"/>
  </g>

  <rect x="240" y="682" width="17" height="17" rx="4" fill="#0D1526" stroke="#D0BEB0" stroke-opacity="0.35"/>
  <text class="body muted" x="270" y="696" font-size="14">Remember me</text>
  <text class="body metalText" x="662" y="696" text-anchor="end" font-size="14">Forgot Password?</text>

  <rect x="238" y="744" width="424" height="66" rx="14" fill="#172036" stroke="url(#metal)" stroke-opacity="0.70"/>
  <rect x="250" y="758" width="400" height="38" rx="10" fill="url(#metal)" fill-opacity="0.08"/>
  <text class="display" x="450" y="786" text-anchor="middle" font-size="18" font-weight="600">Sign In</text>
  <path d="M618 777H638M630 769L638 777L630 785" stroke="#D0BEB0" stroke-opacity="0.72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text class="body muted" x="450" y="856" text-anchor="middle" font-size="14">Don't have an account?</text>
  <text class="body metalText" x="450" y="884" text-anchor="middle" font-size="14">Create Your LuxSync Account</text>

  <path d="M278 918H622" stroke="#D0BEB0" stroke-opacity="0.08"/>
  <text class="body muted" x="450" y="936" text-anchor="middle" font-size="12">Design reference only — implement controls as live semantic HTML/CSS.</text>
</svg>