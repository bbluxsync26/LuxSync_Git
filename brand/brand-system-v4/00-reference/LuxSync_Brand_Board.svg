<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="LuxSync LLC approved crisp dimensional brand board">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D1526"/><stop offset="1" stop-color="#172036"/></linearGradient>
    <linearGradient id="champagne" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D0BEB0"/><stop offset=".25" stop-color="#9E8B85"/><stop offset=".5" stop-color="#D0BEB0"/><stop offset=".72" stop-color="#967878"/><stop offset="1" stop-color="#9E8B85"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7B96B2" stop-opacity=".18"/><stop offset=".5" stop-color="#D0BEB0" stop-opacity=".9"/><stop offset="1" stop-color="#7B96B2" stop-opacity=".25"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0D1526" flood-opacity=".65"/></filter>
    <filter id="softGlow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="heroClip"><rect x="80" y="440" width="820" height="520" rx="34"/></clipPath>
    <clipPath id="productClip"><rect x="938" y="658" width="350" height="302" rx="30"/></clipPath>
    <style>
      .display{font-family:Manrope,Arial,sans-serif;font-weight:600}.body{font-family:Inter,Arial,sans-serif}.caps{letter-spacing:3px;text-transform:uppercase}.fine{stroke:#967878;stroke-width:1.5}.card{fill:#172036;stroke:#9E8B85;stroke-opacity:.35}.small{font-size:15px}.label{font-size:14px;letter-spacing:2px}.muted{fill:#9E8B85}.light{fill:#D0BEB0}.steel{fill:#7B96B2}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1740" cy="-40" r="310" fill="#7B96B2" opacity=".035"/>
  <path d="M1450 52 C1660 8 1830 92 1910 236" fill="none" stroke="url(#steel)" stroke-width="2" opacity=".45"/>

  <text x="80" y="70" class="body caps muted" font-size="15">LuxSync LLC · Brand System 4.0</text>
  <text x="80" y="116" class="display light" font-size="34">Crisp. Dimensional. Intelligently Luxurious.</text>
  <text x="1840" y="72" class="body caps steel" font-size="13" text-anchor="end">Where Luxury Lives Intelligently</text>

  <rect x="80" y="155" width="620" height="245" rx="32" class="card" filter="url(#shadow)"/>
  <text x="112" y="190" class="body caps muted label">Primary Orb Monogram · Approved Artwork</text>
  <image x="152" y="197" width="472" height="190" preserveAspectRatio="xMidYMid meet" xlink:href="../../assets/01-brand/luxsync-monogram-orb.png"/>

  <rect x="732" y="155" width="1108" height="245" rx="32" class="card" filter="url(#shadow)"/>
  <text x="764" y="190" class="body caps muted label">Horizontal Lockup · Approved Artwork · Do Not Retype</text>
  <image x="774" y="213" width="1028" height="154" preserveAspectRatio="xMidYMid meet" xlink:href="../../assets/01-brand/luxsync-horizontal-lockup.png"/>

  <rect x="80" y="440" width="820" height="520" rx="34" fill="#172036" filter="url(#shadow)"/>
  <image x="80" y="440" width="820" height="520" preserveAspectRatio="xMidYMid slice" clip-path="url(#heroClip)" xlink:href="../../assets/12-scenes/home-hero-room.png"/>
  <rect x="80" y="440" width="820" height="520" rx="34" fill="url(#bg)" opacity=".32"/>
  <path d="M80 774 C300 690 520 742 900 540" fill="none" stroke="url(#steel)" stroke-width="2" opacity=".65"/>
  <path d="M80 792 C330 706 540 768 900 570" fill="none" stroke="#967878" stroke-width="1" opacity=".55"/>
  <text x="126" y="530" class="body caps steel label">Website Experience</text>
  <text x="126" y="590" class="display light" font-size="55">Technology that feels</text>
  <text x="126" y="650" class="display" font-size="55" fill="url(#champagne)">like home.</text>
  <text x="128" y="704" class="body light" font-size="20">Quiet intelligence. Beautifully integrated.</text>
  <rect x="126" y="748" width="194" height="54" rx="27" fill="#D0BEB0"/>
  <text x="223" y="782" class="display" font-size="15" fill="#0D1526" text-anchor="middle">EXPLORE SOLUTIONS</text>
  <rect x="338" y="748" width="170" height="54" rx="27" fill="none" stroke="#7B96B2" stroke-width="1.5"/>
  <text x="423" y="782" class="display steel" font-size="15" text-anchor="middle">SHOP CURATED</text>
  <circle cx="812" cy="526" r="3" fill="#D0BEB0" filter="url(#softGlow)"/>
  <path d="M795 526h34M812 509v34" stroke="#D0BEB0" stroke-width="1" opacity=".8"/>

  <rect x="938" y="440" width="902" height="184" rx="30" fill="#D0BEB0"/>
  <text x="972" y="476" class="body caps" fill="#0D1526" font-size="13">Approved Palette · No Lavender · No Orange Drift</text>
  <g class="body" font-size="11" fill="#0D1526">
    <g transform="translate(972 502)"><rect width="92" height="64" rx="14" fill="#0D1526"/><text y="84">Slate Navy</text><text y="100">#0D1526</text></g>
    <g transform="translate(1085 502)"><rect width="92" height="64" rx="14" fill="#172036"/><text y="84">Dark Suede</text><text y="100">#172036</text></g>
    <g transform="translate(1198 502)"><rect width="92" height="64" rx="14" fill="#D0BEB0" stroke="#9E8B85"/><text y="84">Pale Driftwood</text><text y="100">#D0BEB0</text></g>
    <g transform="translate(1311 502)"><rect width="92" height="64" rx="14" fill="#9E8B85"/><text y="84">Warm Taupe</text><text y="100">#9E8B85</text></g>
    <g transform="translate(1424 502)"><rect width="92" height="64" rx="14" fill="#967878"/><text y="84">Antique Rose</text><text y="100">#967878</text></g>
    <g transform="translate(1537 502)"><rect width="92" height="64" rx="14" fill="#7B96B2"/><text y="84">Dusty Steel</text><text y="100">#7B96B2</text></g>
    <g transform="translate(1650 502)"><rect width="156" height="64" rx="14" fill="url(#champagne)"/><path d="M166 7l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" transform="translate(-26 4)" fill="#D0BEB0"/><text y="84">Champagne Rose Gold</text><text y="100">Metallic treatment</text></g>
  </g>

  <rect x="938" y="658" width="350" height="302" rx="30" fill="#172036" filter="url(#shadow)"/>
  <image x="938" y="658" width="350" height="302" preserveAspectRatio="xMidYMid slice" clip-path="url(#productClip)" xlink:href="../../assets/12-scenes/smart-hub-vignette.png"/>
  <rect x="958" y="678" width="102" height="30" rx="15" fill="#0D1526" opacity=".88"/>
  <text x="1009" y="698" class="body caps light" font-size="10" text-anchor="middle">LuxSync Pick</text>
  <rect x="958" y="880" width="310" height="60" rx="18" fill="#0D1526" opacity=".92"/>
  <text x="979" y="906" class="display light" font-size="17">Curated Smart Hub</text>
  <text x="979" y="928" class="body muted" font-size="12">Compatibility-first · No subscription</text>

  <rect x="1320" y="658" width="520" height="302" rx="30" class="card" filter="url(#shadow)"/>
  <text x="1354" y="700" class="body caps muted label">Typography & Interface</text>
  <text x="1354" y="750" class="display light" font-size="34">Manrope 500 / 600</text>
  <text x="1354" y="783" class="body muted" font-size="18">Headlines · navigation · buttons · editable graphic UI</text>
  <text x="1354" y="834" class="body light" font-size="30">Inter 400 / 500</text>
  <text x="1354" y="866" class="body muted" font-size="18">Body copy · product details · forms · supporting UI</text>
  <line x1="1354" y1="897" x2="1805" y2="897" stroke="#967878" opacity=".6"/>
  <text x="1354" y="930" class="body light" font-size="14">Logo lettering remains the approved dimensional artwork.</text>
  <circle cx="1798" cy="918" r="3" fill="#D0BEB0" filter="url(#softGlow)"/>
  <path d="M1786 918h24M1798 906v24" stroke="#D0BEB0" stroke-width="1"/>

  <text x="80" y="1020" class="body caps muted" font-size="13">Visual rules: exact approved logos · crisp photography · quiet navy depth · restrained metallic shine · sparse accent sparkles</text>
  <text x="1840" y="1020" class="body caps steel" font-size="13" text-anchor="end">Manrope + Inter · LuxSync LLC</text>
