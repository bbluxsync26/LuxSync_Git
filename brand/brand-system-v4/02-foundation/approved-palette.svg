<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-label="LuxSync approved color palette">
<defs>
 <linearGradient id="champagne" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D0BEB0"/><stop offset=".28" stop-color="#9E8B85"/><stop offset=".52" stop-color="#D0BEB0"/><stop offset=".75" stop-color="#967878"/><stop offset="1" stop-color="#9E8B85"/></linearGradient>
