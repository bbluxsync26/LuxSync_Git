<!-- LuxSync email signature template. Replace placeholders at use time. -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Inter,Arial,sans-serif;color:#D0BEB0;background:#0D1526;max-width:620px;">
  <tr>
    <td style="padding:18px 20px 16px 20px;vertical-align:top;border-right:1px solid #967878;">
      <img src="{{logo_url}}" width="210" alt="LuxSync — Where Luxury Lives Intelligently" style="display:block;width:210px;height:auto;border:0;outline:none;text-decoration:none;">
    </td>
    <td style="padding:16px 20px;vertical-align:middle;">
      <div style="font-family:Manrope,Arial,sans-serif;font-size:17px;line-height:22px;font-weight:600;letter-spacing:.02em;color:#D0BEB0;">{{name}}</div>
      <div style="font-size:13px;line-height:19px;font-weight:500;color:#9E8B85;margin-top:2px;">{{title}}</div>
      <div style="font-size:12px;line-height:18px;color:#D0BEB0;margin-top:9px;">
        <span>{{email}}</span><br>
        <span>{{phone}}</span><br>
        <span>{{website}}</span>
      </div>
      <div style="font-size:10px;line-height:15px;letter-spacing:.12em;text-transform:uppercase;color:#7B96B2;margin-top:10px;">Where Luxury Lives Intelligently</div>
    </td>
  </tr>
</table>
