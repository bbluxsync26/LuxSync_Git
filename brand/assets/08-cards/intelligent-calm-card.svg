    </style>
  </defs><rect x="30" y="30" width="540" height="780" rx="48" fill="#172036" stroke="#967878" stroke-opacity=".55" stroke-width="3" filter="url(#roseGlow)"/><g transform="translate(172 78) scale(.5)" filter="url(#roseGlow)"><path class="line" d="M148 232c0-62 48-110 108-110s108 48 108 110c0 82-60 118-108 118s-108-36-108-118Z"/><path class="line2" d="M256 124v226M186 226c35 28 105 28 140 0M170 390c48-20 124-20 172 0M190 426c38-14 94-14 132 0"/></g><text x="300" y="485" class="display" font-size="42" fill="#D0BEB0" text-anchor="middle">Intelligent Calm</text><text x="300" y="555" class="body" font-size="27" fill="#9E8B85" text-anchor="middle" font-weight="400">LuxSync anticipates. It learns</text><text x="300" y="591.45" class="body" font-size="27" fill="#9E8B85" text-anchor="middle" font-weight="400">your rhythms, adjusts your</text><text x="300" y="627.9" class="body" font-size="27" fill="#9E8B85" text-anchor="middle" font-weight="400">environment, and never</text><text x="300" y="664.35" class="body" font-size="27" fill="#9E8B85" text-anchor="middle" font-weight="400">interrupts your flow.</text></svg>