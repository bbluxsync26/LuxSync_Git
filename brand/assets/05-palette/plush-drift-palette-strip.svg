<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="330" viewBox="0 0 1500 330" role="img" aria-label="Plush Drift palette strip">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D1526"/><stop offset="1" stop-color="#172036"/></linearGradient>
    <linearGradient id="navyDrift" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0D1526"/><stop offset="1" stop-color="#172036"/></linearGradient>
    <linearGradient id="warmVeil" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#D0BEB0" stop-opacity=".72"/><stop offset="1" stop-color="#D0BEB0" stop-opacity="0"/></linearGradient>
    <linearGradient id="lavenderMist" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7B96B2" stop-opacity=".55"/><stop offset="1" stop-color="#7B96B2" stop-opacity="0"/></linearGradient>
    <radialGradient id="roseDrift"><stop stop-color="#967878" stop-opacity=".85"/><stop offset="1" stop-color="#967878" stop-opacity="0"/></radialGradient>
    <radialGradient id="softLight"><stop stop-color="#D0BEB0"/><stop offset=".32" stop-color="#967878" stop-opacity=".7"/><stop offset="1" stop-color="#967878" stop-opacity="0"/></radialGradient>
    <filter id="roseGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="14" result="b"/><feColorMatrix in="b" values="0 0 0 0 .588 0 0 0 0 .471 0 0 0 0 .471 0 0 0 .75 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="steelGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10" result="b"/><feColorMatrix in="b" values="0 0 0 0 .482 0 0 0 0 .588 0 0 0 0 .698 0 0 0 .7 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0D1526" flood-opacity=".6"/></filter>
    <filter id="suedeNoise" x="0" y="0" width="100%" height="100%"><feTurbulence baseFrequency=".7" numOctaves="4" seed="23" type="fractalNoise" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="g"/><feComponentTransfer in="g"><feFuncA type="table" tableValues="0 .15"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter>
    <style>
      .display{font-family:'Century Gothic','URW Gothic','DejaVu Sans',sans-serif}
      .body{font-family:Candara,'DejaVu Sans',sans-serif}
      .mono{font-family:Consolas,'DejaVu Sans Mono',monospace}
      .line{fill:none;stroke:#967878;stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
      .line2{fill:none;stroke:#D0BEB0;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
      .soft{fill:#172036;stroke:#967878;stroke-opacity:.55;stroke-width:3}
    </style>
  </defs><rect x="0" width="250" height="330" fill="#0D1526"/><text x="24" y="242" class="display" font-size="25" fill="#D0BEB0">Slate Navy</text><text x="24" y="278" class="mono" font-size="22" fill="#D0BEB0" opacity=".8">#0D1526</text><text x="24" y="310" class="body" font-size="18" fill="#D0BEB0" opacity=".7">Primary Background</text><rect x="250" width="250" height="330" fill="#172036"/><text x="274" y="242" class="display" font-size="25" fill="#D0BEB0">Dark Suede</text><text x="274" y="278" class="mono" font-size="22" fill="#D0BEB0" opacity=".8">#172036</text><text x="274" y="310" class="body" font-size="18" fill="#D0BEB0" opacity=".7">Card Surface</text><rect x="500" width="250" height="330" fill="#D0BEB0"/><text x="524" y="242" class="display" font-size="25" fill="#0D1526">Pale Driftwood</text><text x="524" y="278" class="mono" font-size="22" fill="#0D1526" opacity=".8">#D0BEB0</text><text x="524" y="310" class="body" font-size="18" fill="#0D1526" opacity=".7">Primary Text</text><rect x="750" width="250" height="330" fill="#9E8B85"/><text x="774" y="242" class="display" font-size="25" fill="#0D1526">Warm Taupe Mauve</text><text x="774" y="278" class="mono" font-size="22" fill="#0D1526" opacity=".8">#9E8B85</text><text x="774" y="310" class="body" font-size="18" fill="#0D1526" opacity=".7">Secondary Text</text><rect x="1000" width="250" height="330" fill="#967878"/><text x="1024" y="242" class="display" font-size="25" fill="#0D1526">Antique Rose Taupe</text><text x="1024" y="278" class="mono" font-size="22" fill="#0D1526" opacity=".8">#967878</text><text x="1024" y="310" class="body" font-size="18" fill="#0D1526" opacity=".7">Decorative / Tertiary</text><rect x="1250" width="250" height="330" fill="#7B96B2"/><text x="1274" y="242" class="display" font-size="25" fill="#0D1526">Dusty Steel</text><text x="1274" y="278" class="mono" font-size="22" fill="#0D1526" opacity=".8">#7B96B2</text><text x="1274" y="310" class="body" font-size="18" fill="#0D1526" opacity=".7">CTA / Accent</text></svg>