name: Validate LuxSync Brand System 4.0

on:
  pull_request:
  push:
    branches: [master, "brand/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate authoritative visual system
        run: python scripts/validate-crisp-brand-v4.py

