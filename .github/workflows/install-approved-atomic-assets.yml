name: Install approved LuxSync atomic assets

on:
  push:
    branches:
      - brand/atomic-cutover-final
    paths:
      - 'scripts/build-approved-atomic-brand-assets.py'
      - 'scripts/validate-brand-v3.py'
      - '.github/workflows/install-approved-atomic-assets.yml'

permissions:
  contents: write

concurrency:
  group: luxsync-approved-atomic-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct atomic cutover bookkeeping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          builder = Path('scripts/build-approved-atomic-brand-assets.py')
          s = builder.read_text(encoding='utf-8')
          old = "else 100,b,f'LuxSync {n} UI control'))"
          new = "else 100,100,b,f'LuxSync {n} UI control'))"
          if old in s:
              builder.write_text(s.replace(old, new, 1), encoding='utf-8')
          validator = Path('scripts/validate-brand-v3.py')
          v = validator.read_text(encoding='utf-8')
          if 'len(files) < 128' in v:
              validator.write_text(v.replace('len(files) < 128', 'len(files) < 127', 1), encoding='utf-8')
          PY
      - name: Build approved atomic asset library
        run: python3 scripts/build-approved-atomic-brand-assets.py
      - name: Reconcile active repository references
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, replacements):
              p = Path(path)
              if not p.exists():
                  return
              s = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')

          replace('README.md', [
              ('brand/assets/01-brand/luxsync-horizontal-lockup.png', 'brand/source-logo/LuxSync_Logo_Horizontal_Combo.png'),
              ('LuxSync-v3', 'LuxSync-Atomic'),
              ('### LuxSync v3', '### LuxSync Atomic Brand System'),
              ('Active asset root: `brand/assets-v3/`', 'Active asset root: `brand/assets/`'),
          ])

          replace('website/styles/design-system.md', [
              ('**Brand system:** LuxSync v3', '**Brand system:** LuxSync Atomic Brand System'),
              ('**Primary asset source:** `brand/assets-v3/`', '**Primary asset source:** `brand/assets/`'),
              ('LuxSync v3 is the active website treatment.', 'The LuxSync Atomic Brand System is the active website treatment.'),
              ('brand/assets/01-brand/luxsync-monogram-orb.png', 'brand/source-logo/LuxSync_Logo_Orb.png'),
              ('brand/assets/01-brand/luxsync-horizontal-lockup.png', 'brand/source-logo/LuxSync_Logo_Horizontal_Combo.png'),
              ('Use approved v3 SVG compositions for branded graphics.', 'Use approved atomic SVG assets from `brand/assets/` for branded graphics.'),
              ('LuxSync v3 carries forward Plush Drift', 'The LuxSync Atomic Brand System carries forward Plush Drift'),
          ])
          p = Path('website/styles/design-system.md')
          s = p.read_text(encoding='utf-8')
          start = s.find('## Active Website Assets')
          end = s.find('## Component Language')
          if start != -1 and end != -1 and end > start:
              block = '''## Active Website Assets\n\nUse the individual atomic files under:\n\n- `brand/assets/01-logos/`\n- `brand/assets/02-icons/`\n- `brand/assets/03-buttons/`\n- `brand/assets/04-ui-controls/`\n- `brand/assets/05-dividers-accents/`\n- `brand/assets/06-product-cards/`\n- `brand/assets/07-heroes/`\n- `brand/assets/08-roi/`\n- `brand/assets/09-stationery/`\n- `brand/assets/11-marketing/`\n- `brand/assets/12-palette/`\n\nEach reusable object is its own file. Brushed Dusty Steel is the approved metallic-blue treatment.\n\n'''
              s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')

          replace('docs/master-catalog.md', [
              ('**Authoritative visual system:** LuxSync v3', '**Authoritative visual system:** LuxSync Atomic Brand System'),
              ('**Active asset root:** `brand/assets-v3/`', '**Active asset root:** `brand/assets/`'),
              ('| BRAND-001 | Brand Guidelines | `brand/README.md` | Active — LuxSync v3 |', '| BRAND-001 | Brand Guidelines | `brand/README.md` | Active — Atomic Brand System |'),
              ('| BRAND-005 | v3 Asset System | `brand/assets-v3/` | Active / Authoritative |', '| BRAND-005 | Atomic Asset System | `brand/assets/` | Active / Authoritative |'),
              ('| BRAND-006 | v3 Brand Board | `brand/assets-v3/00-reference/brand-board.svg` | Active reference |', '| BRAND-006 | Authoritative Logo Masters | `brand/source-logo/` | Active / Immutable |'),
              ('| BRAND-007 | v3 Asset Manifest | `brand/assets-v3/08-docs/asset-manifest.json` | Active |', '| BRAND-007 | Atomic Asset Manifest | `brand/assets/asset-manifest.json` | Active |'),
              ('| BRAND-008 | v3 Migration Guide | `brand/assets-v3/08-docs/MIGRATION.md` | Active |', '| BRAND-008 | Atomic Asset README | `brand/assets/README.md` | Active |'),
              ('| BRAND-009 | Legacy Asset Library | `brand/assets/` | Legacy / Compatibility only |', '| BRAND-009 | Brushed Dusty Steel Metallic | `brand/assets/12-palette/brushed-dusty-steel-metallic.svg` | Active / Approved |'),
              ('| BRAND-010 | Production Scene Manifest | `brand/assets/12-scenes/scene-manifest.csv` | Retained source photography |', '| BRAND-010 | Champagne Rose Gold Metallic | `brand/assets/12-palette/champagne-rose-gold-metallic.svg` | Active / Approved |'),
              ('## v3 Asset Groups', '## Atomic Asset Groups'),
              ('`brand/assets-v3/00-reference/`', '`brand/source-logo/`'),
              ('`brand/assets-v3/01-foundation/`', '`brand/assets/12-palette/`'),
              ('`brand/assets-v3/02-ui/`', '`brand/assets/03-buttons/` + `brand/assets/04-ui-controls/`'),
              ('`brand/assets-v3/03-icons/`', '`brand/assets/02-icons/`'),
              ('`brand/assets-v3/04-heroes/`', '`brand/assets/07-heroes/` + `brand/assets/08-roi/`'),
              ('`brand/assets-v3/05-ecommerce/`', '`brand/assets/06-product-cards/`'),
              ('`brand/assets-v3/06-stationery/`', '`brand/assets/09-stationery/`'),
              ('`brand/assets-v3/07-marketing/`', '`brand/assets/11-marketing/`'),
              ('`brand/assets-v3/08-docs/`', '`brand/assets/README.md` + `brand/assets/asset-manifest.json`'),
              ('Active — LuxSync v3', 'Active — Atomic Brand System'),
          ])

          # Remove any remaining active references to the retired asset-v3 root in these governing files.
          for path in ['README.md', 'website/styles/design-system.md', 'docs/master-catalog.md']:
              p = Path(path)
              s = p.read_text(encoding='utf-8').replace('brand/assets-v3/', 'brand/assets/').replace('brand/assets-v3', 'brand/assets')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Validate hard cutover
        run: |
          test -d brand/assets
          test ! -e brand/assets-v3
          test -f brand/source-logo/LuxSync_Logo_Horizontal_Combo.png
          test -f brand/source-logo/LuxSync_Logo_Horizontal_Final.png
          test -f brand/source-logo/LuxSync_Logo_Orb.png
          test "$(find brand/assets/01-logos -type f -name '*.svg' | wc -l)" -eq 3
          test "$(find brand/assets/02-icons -type f -name '*.svg' | wc -l)" -eq 15
          test "$(find brand/assets/03-buttons -type f -name '*.svg' | wc -l)" -eq 18
          test "$(find brand/assets/04-ui-controls -type f -name '*.svg' | wc -l)" -eq 25
          test "$(find brand/assets/05-dividers-accents -type f -name '*.svg' | wc -l)" -eq 44
          test "$(find brand/assets/06-product-cards -type f -name '*.svg' | wc -l)" -eq 4
          test "$(find brand/assets/07-heroes -type f -name '*.svg' | wc -l)" -eq 1
          test "$(find brand/assets/08-roi -type f -name '*.svg' | wc -l)" -eq 1
          test "$(find brand/assets/09-stationery -type f -name '*.svg' | wc -l)" -eq 4
          test "$(find brand/assets/11-marketing -type f -name '*.svg' | wc -l)" -eq 2
          test "$(find brand/assets/12-palette -type f -name '*.svg' | wc -l)" -eq 9
          grep -q 'Brushed Dusty Steel' brand/assets/README.md
          grep -q 'LuxSync_Logo_Orb.png' brand/assets/README.md
          ! grep -q 'brand/assets-v3' README.md website/styles/design-system.md docs/master-catalog.md
          if grep -RIn --include='*.md' --include='*.svg' -E 'icy-blue highlight tints may be used' brand/assets brand/README.md brand/colors.md; then exit 1; fi
          python3 scripts/validate-brand-v3.py
          git diff --check
      - name: Commit atomic cutover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/install-approved-atomic-assets.yml
          git add -A
          git commit -m 'Finalize approved LuxSync atomic asset cutover'
          git push origin HEAD:${GITHUB_REF_NAME}
