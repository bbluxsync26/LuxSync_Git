name: Regenerate LuxSync brand raster assets

on:
  push:
    branches:
      - fix/regenerate-brand-raster-fonts
    paths:
      - scripts/regenerate-brand-raster-assets.py
      - .github/workflows/regenerate-brand-raster-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape imagemagick fontconfig curl

      - name: Install authoritative LuxSync fonts
        run: |
          mkdir -p "$HOME/.local/share/fonts"
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/Manrope%5Bwght%5D.ttf' \
            -o "$HOME/.local/share/fonts/Manrope.ttf"
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf' \
            -o "$HOME/.local/share/fonts/Inter.ttf"
          fc-cache -f
          fc-match Manrope
          fc-match Inter

      - name: Regenerate text-bearing PNG and WebP assets
        run: python3 scripts/regenerate-brand-raster-assets.py

      - name: Validate generated changes
        run: |
          git diff --check
          if grep -RIl --include='*.svg' -E '<text\b' brand/assets \
            | xargs -r grep -nE 'Century Gothic|Candara'; then
            echo 'Legacy text font declaration remains in a text-bearing SVG.' >&2
            exit 1
          fi

      - name: Commit regenerated assets
        run: |
          if git diff --quiet; then
            echo 'No raster or SVG changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brand/assets
          git commit -m 'Regenerate text-bearing raster assets with Manrope and Inter'
          git push origin HEAD:${GITHUB_REF_NAME}
