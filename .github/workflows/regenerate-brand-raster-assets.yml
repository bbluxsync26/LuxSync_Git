name: Generate LuxSync Luxury Orbit assets

on:
  push:
    branches:
      - master
      - brand/luxury-orbit-refresh
    paths:
      - scripts/generate-luxury-orbit-assets.py
      - scripts/regenerate-brand-raster-assets.py
      - .github/workflows/regenerate-brand-raster-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y inkscape imagemagick python3-pil fonts-dejavu-core fonts-liberation

      - name: Generate SVG, PNG, WebP, and catalog sheets
        run: python3 scripts/regenerate-brand-raster-assets.py

      - name: Validate generated library
        run: |
          test "$(find brand/assets -type f -name '*.svg' | wc -l)" -eq 97
          test "$(find brand/assets -type f -name '*.webp' | wc -l)" -eq 97
          test "$(find brand/assets -type f -name '*.png' | wc -l)" -ge 108
          test -f brand/assets/00-catalog/SVG-ASSET-LIST.md
          git diff --check

      - name: Commit regenerated assets
        run: |
          if git diff --quiet; then
            echo 'No generated asset changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brand/assets
          git commit -m 'Regenerate LuxSync Luxury Orbit web graphics'
          git push origin HEAD:${GITHUB_REF_NAME}
