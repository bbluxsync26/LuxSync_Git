name: Legacy LuxSync asset regeneration

# Historical workflow retained for rollback/reference only.
# LuxSync v3 is authoritative and must never be overwritten by this workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy workflow notice
        run: |
          echo 'The generated Luxury Orbit asset system is retired.'
          echo 'Use brand/assets-v3 for current LuxSync branding and website graphics.'
          echo 'Protected logos remain in brand/assets/01-brand and must not be regenerated.'
