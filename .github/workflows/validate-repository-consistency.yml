name: Validate LuxSync repository consistency

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconcile metadata in check mode
        run: |
          cp brand/assets/asset-manifest.csv /tmp/asset-manifest.csv.before
          cp brand/assets/asset-manifest.json /tmp/asset-manifest.json.before
          cp brand/assets/00-catalog/ASSET-INVENTORY.txt /tmp/asset-inventory.before
          python scripts/reconcile-asset-metadata.py
          diff -u /tmp/asset-manifest.csv.before brand/assets/asset-manifest.csv
          diff -u /tmp/asset-manifest.json.before brand/assets/asset-manifest.json
          diff -u /tmp/asset-inventory.before brand/assets/00-catalog/ASSET-INVENTORY.txt

      - name: Validate source-of-truth consistency
        run: python scripts/validate-repository-consistency.py

      - name: Validate whitespace
        run: git diff --check
