name: Validate LuxSync repository consistency

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate approved LuxSync atomic brand source of truth
        run: python scripts/validate-brand-v3.py

      - name: Validate whitespace
        run: git diff --check
