name: Validate LuxSync repository consistency

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate production brand library
        run: python scripts/validate-production-brand.py

      - name: Validate omnichannel brand derivatives
        run: python scripts/validate-brand-derivatives.py

      - name: Validate repository source of truth
        run: python scripts/validate-repository-consistency.py

      - name: Verify Concierge production engine is current
        run: |
          node website/src/concierge/assemble-engine.mjs
          git diff --exit-code -- website/src/concierge/luxsync-concierge-engine.v1.json

      - name: Build production website
        run: node site/build.mjs

      - name: Validate production website
        run: node site/test.mjs

      - name: Validate whitespace
        run: git diff --check
