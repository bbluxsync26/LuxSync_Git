name: Complete LuxSync production source of truth

on:
  push:
    branches:
      - website/production-completion
    paths:
      - '.github/workflows/complete-production-source-of-truth.yml'

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: website/production-completion
          fetch-depth: 0

      - name: Reconcile production source of truth
        run: python scripts/complete-production-source-of-truth.py

      - name: Build tracked Concierge production engine
        run: node website/src/concierge/assemble-engine.mjs

      - name: Validate production brand
        run: python scripts/validate-production-brand.py

      - name: Validate repository source of truth
        run: python scripts/validate-repository-consistency.py

      - name: Validate whitespace
        run: git diff --check

      - name: Commit completed website source of truth
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Complete LuxSync website production source of truth'
          git push origin website/production-completion
