name: Patch site clean asset paths

on:
  push:
    branches:
      - fix/clean-triple-format-assets
    paths:
      - '.github/workflows/patch-site-clean-asset-paths.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/clean-triple-format-assets
          fetch-depth: 0
      - name: Patch production site logo paths
        run: |
          python - <<'PY'
          from pathlib import Path

          build=Path('site/build.mjs')
          text=build.read_text(encoding='utf-8')
          text=text.replace("path.join(ROOT, 'brand', 'assets', '01-logos')","path.join(ROOT, 'brand', 'assets', 'logos', 'png')")
          text=text.replace('LuxSync_Logo_Horizontal_Combo.png','luxsync-horizontal-combo.png')
          text=text.replace('LuxSync_Logo_Horizontal_Final.png','luxsync-horizontal.png')
          text=text.replace('LuxSync_Logo_Orb.png','luxsync-orb.png')
          build.write_text(text,encoding='utf-8')

          test=Path('site/test.mjs')
          text=test.read_text(encoding='utf-8')
          old="""for (const logo of ['LuxSync_Logo_Horizontal_Combo.png', 'LuxSync_Logo_Horizontal_Final.png', 'LuxSync_Logo_Orb.png']) {
  const source = path.join(ROOT, 'brand', 'source-logo', logo);
  const production = path.join(ROOT, 'brand', 'assets', '01-logos', logo);
  const built = path.join(DIST, 'assets', logo);
  if (![source, production, built].every(fs.existsSync)) {
    errors.push(`Missing protected logo path for ${logo}`);
    continue;
  }
  const hashes = [hash(source), hash(production), hash(built)];
  if (new Set(hashes).size !== 1) errors.push(`${logo}: production/built copy differs from protected source master`);
}
"""
          new="""const protectedLogos = [
  ['LuxSync_Logo_Horizontal_Combo.png', 'luxsync-horizontal-combo.png'],
  ['LuxSync_Logo_Horizontal_Final.png', 'luxsync-horizontal.png'],
  ['LuxSync_Logo_Orb.png', 'luxsync-orb.png']
];
for (const [sourceName, productionName] of protectedLogos) {
  const source = path.join(ROOT, 'brand', 'source-logo', sourceName);
  const production = path.join(ROOT, 'brand', 'assets', 'logos', 'png', productionName);
  const built = path.join(DIST, 'assets', productionName);
  if (![source, production, built].every(fs.existsSync)) {
    errors.push(`Missing protected logo path for ${productionName}`);
    continue;
  }
  const hashes = [hash(source), hash(production), hash(built)];
  if (new Set(hashes).size !== 1) errors.push(`${productionName}: production/built copy differs from protected source master`);
}
"""
          if old not in text:
              raise SystemExit('Expected protected-logo validation block not found')
          text=text.replace(old,new)
          test.write_text(text,encoding='utf-8')
          PY
      - name: Verify site build
        run: |
          node site/build.mjs
          node site/test.mjs
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/patch-site-clean-asset-paths.yml
          git add -A
          git diff --cached --check
          git commit -m 'Wire production site to clean asset library'
          git push origin fix/clean-triple-format-assets
