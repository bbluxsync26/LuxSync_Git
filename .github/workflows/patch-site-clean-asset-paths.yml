name: Patch site clean asset paths

on:
  push:
    branches:
      - fix/clean-triple-format-assets
    paths:
      - '.github/workflows/patch-site-clean-asset-paths.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/clean-triple-format-assets
          fetch-depth: 0

      - name: Patch production site logo paths
        shell: bash
        run: |
          sed -i "s/path.join(ROOT, 'brand', 'assets', '01-logos')/path.join(ROOT, 'brand', 'assets', 'logos', 'png')/g" site/build.mjs
          sed -i 's/LuxSync_Logo_Horizontal_Combo.png/luxsync-horizontal-combo.png/g' site/build.mjs
          sed -i 's/LuxSync_Logo_Horizontal_Final.png/luxsync-horizontal.png/g' site/build.mjs
          sed -i 's/LuxSync_Logo_Orb.png/luxsync-orb.png/g' site/build.mjs
          if grep -Fq "path.join(ROOT, 'brand', 'assets', '01-logos')" site/build.mjs; then
            echo 'Old logo directory remains in site/build.mjs'
            exit 1
          fi
          if grep -Eq 'LuxSync_Logo_(Horizontal_Combo|Horizontal_Final|Orb)\.png' site/build.mjs; then
            echo 'Old production logo filename remains in site/build.mjs'
            exit 1
          fi

      - name: Validate complete site cutover
        shell: bash
        run: |
          node website/src/concierge/assemble-engine.mjs
          git diff --exit-code -- website/src/concierge/luxsync-concierge-engine.v1.json
          python scripts/validate-production-brand.py
          python scripts/validate-repository-consistency.py
          node site/build.mjs
          node site/test.mjs
          git diff --check

      - name: Commit site repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/patch-site-clean-asset-paths.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No site repair changes to commit.'
          else
            git commit -m 'Wire production site to clean asset library'
            git push origin fix/clean-triple-format-assets
          fi
