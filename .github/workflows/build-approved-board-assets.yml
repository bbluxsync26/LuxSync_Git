name: Build LuxSync approved-board assets

on:
  push:
    branches:
      - 'feature/brand-*'
    paths:
      - '.github/workflows/build-approved-board-assets.yml'
      - 'scripts/build-approved-board-assets.py'
      - 'scripts/reconcile-approved-board-integration.py'
      - 'brand/reference-boards/icons_board.png'
      - 'brand/reference-boards/dividers_board.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build faithful board-derived assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python -m pip install pillow

      - name: Build approved-board assets
        run: python scripts/build-approved-board-assets.py

      - name: Reconcile approved-board integration state
        run: python scripts/reconcile-approved-board-integration.py

      - name: Commit generated masters, exports, QA, manifests, and state
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No approved-board asset or state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand/masters/approved-board-raster \
                  brand/exports/digital/approved \
                  brand/audit/qa/approved-icons-board-derived.jpg \
                  brand/audit/qa/approved-dividers-board-derived.jpg \
                  brand/audit/brand-build-state.json \
                  brand/manifests/approved-board-asset-manifest.json \
                  brand/manifests/omnichannel-brand-manifest.json
          git commit -m "Reconcile faithful approved-board brand assets [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
