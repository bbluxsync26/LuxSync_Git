name: Build LuxSync production release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this validated build to GoDaddy production'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: luxsync-production-release
  cancel-in-progress: false

env:
  LUXSYNC_COMMERCE_URL: ${{ vars.LUXSYNC_COMMERCE_URL }}
  LUXSYNC_CONTACT_ENDPOINT: ${{ vars.LUXSYNC_CONTACT_ENDPOINT }}
  LUXSYNC_SITE_URL: ${{ vars.LUXSYNC_SITE_URL }}

jobs:
  build-release:
    name: Build validated production candidate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate production brand library
        run: python scripts/validate-production-brand.py

      - name: Validate repository source of truth
        run: python scripts/validate-repository-consistency.py

      - name: Verify Concierge production engine is current
        run: |
          node website/src/concierge/assemble-engine.mjs
          git diff --exit-code -- website/src/concierge/luxsync-concierge-engine.v1.json

      - name: Build production website
        run: node site/build.mjs

      - name: Validate production website
        run: node site/test.mjs

      - name: Package validated production candidate
        uses: actions/upload-artifact@v4
        with:
          name: luxsync-production-candidate
          path: site/dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to GoDaddy production
    needs: build-release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download validated production candidate
        uses: actions/download-artifact@v4
        with:
          name: luxsync-production-candidate
          path: site/dist/

      - name: Require complete GoDaddy deployment configuration
        shell: bash
        env:
          FTP_URL: ${{ secrets.GODADDY_FTP_URL }}
          FTP_USER: ${{ secrets.GODADDY_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.GODADDY_FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.GODADDY_REMOTE_DIR }}
        run: |
          if [[ -z "$FTP_URL" || -z "$FTP_USER" || -z "$FTP_PASSWORD" || -z "$REMOTE_DIR" ]]; then
            echo 'Production publish requested, but GoDaddy deployment configuration is incomplete.'
            exit 1
          fi

      - name: Install FTP deployment client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Publish validated site to GoDaddy
        shell: bash
        env:
          FTP_URL: ${{ secrets.GODADDY_FTP_URL }}
          FTP_USER: ${{ secrets.GODADDY_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.GODADDY_FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.GODADDY_REMOTE_DIR }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_URL" -e "set ssl:verify-certificate yes; mirror -R --delete --verbose site/dist/ \"$REMOTE_DIR\"; bye"
